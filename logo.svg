<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 机器人头部（最外层） -->
  <g transform="translate(128 128)">
    <!-- 头部外框（圆角矩形） -->
    <rect x="-110" y="-110" width="220" height="230" rx="48" ry="48"
          fill="#ffffff" stroke="#FF7A00" stroke-width="12"/>

    <!-- 左耳 -->
    <rect x="-128" y="-30" width="22" height="60" rx="10" ry="10" fill="#FF7A00"/>
    <!-- 右耳 -->
    <rect x="106" y="-30" width="22" height="60" rx="10" ry="10" fill="#FF7A00"/>

    <!-- 内部填充字母 G（橙色） -->
    <text x="0" y="20" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="900"
          font-size="210" fill="#FF7A00">G</text>
  </g>
</svg>