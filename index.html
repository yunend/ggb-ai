<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GGB-AI</title>
    <link rel="shortcut icon" href="./logo.ico" type="image/x-icon">
    <script src="./js/vue@3.5.13-global-prod.js"></script>
    <script src="./js/tailwind@3.4.17.js"></script>
    <script defer src="./GeoGebra/deployggb.js"></script>
  </head>
  <body class="bg-slate-100">
    <div id="app"></div>
    <script src="./js/constants.js"></script>
    <script src="./js/geogebra.js"></script>
    <script src="./js/code-panel.js"></script>
    <script>
      const { createApp, ref, onMounted, onBeforeUnmount } = Vue

      // ===== NavBar =====
      const NavBar = {
        emits: ['openPrompt'],
        template: `
          <nav class="w-full bg-blue-700">
            <section class="h-18 w-10/12 mx-auto font-mono text-white flex items-center gap-x-3">
              <span class="text-xl font-black tracking-wider text-yellow-400">GGB-AI</span>
              <ul class="flex gap-x-3 items-center">
                <li><a href="https://github.com/yunend/ggb-ai" class="block p-3 hover:bg-blue-900/50 transition-colors duration-200">Home</a></li>
                <li><a href="./GeoGebra/HTML5/5.0/GeoGebra.html" target="_blank" class="block p-3 hover:bg-blue-900/50 transition-colors duration-200">Local</a></li>
                <li><button @click="$emit('openPrompt')" class="block p-3 hover:bg-blue-900/50 transition-colors duration-200 cursor-pointer">Prompt</button></li>
              </ul>
            </section>
          </nav>
        `
      }

      // ===== ToolBar =====
      const ToolBar = {
        props: ['show', 'showCodePanel', 'perspectiveIs3D', 'interval', 'running'],
        emits: ['toggle', 'toggle-code-panel', 'update:interval', 'run', 'stop', 'clearCode', 'clearCanvas', 'switch-perspective'],
        template: `
          <div class="h-10 bg-white flex items-center gap-3 px-2 text-sm shadow mb-0.5">
            <button @click="$emit('toggle-code-panel')" :class="['px-3 py-1 rounded font-medium transition', showCodePanel ? 'bg-blue-100 text-blue-700 hover:bg-blue-200' : 'bg-slate-100 text-slate-500 hover:bg-slate-200']">{{ showCodePanel ? '◀ 代码' : '代码 ▶' }}</button>
            <span class="h-5 w-px bg-slate-200"></span>
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <span class="text-slate-700">工具栏</span>
              <span @click="$emit('toggle')" :class="['relative inline-flex h-5 w-9 items-center rounded-full transition-colors duration-200', show ? 'bg-blue-600' : 'bg-slate-300']">
                <span :class="['inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform duration-200', show ? 'translate-x-4' : 'translate-x-0.5']"></span>
              </span>
            </label>
            <span class="h-5 w-px bg-slate-200"></span>
            <button @click="$emit('switch-perspective', !perspectiveIs3D)" :class="['px-3 py-1 rounded font-medium transition', perspectiveIs3D ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200']">视角 {{ perspectiveIs3D ? '3D' : '2D' }}</button>
            <span class="h-5 w-px bg-slate-200"></span>
            <label class="flex items-center gap-1 text-slate-500">
              间隔
              <input :value="interval" @input="$emit('update:interval', Number($event.target.value))" type="number" min="0" step="50" class="w-16 px-1 py-0.5 border border-slate-300 rounded text-right" />
              ms
            </label>
            <button @click="$emit('run')" :disabled="running" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 active:bg-blue-800 transition disabled:bg-slate-400 disabled:cursor-not-allowed">{{ running ? '执行中...' : '执行' }}</button>
            <button @click="$emit('stop')" :disabled="!running" class="px-3 py-1 bg-orange-500 text-white rounded hover:bg-orange-600 active:bg-orange-700 transition disabled:bg-slate-300 disabled:cursor-not-allowed">停止</button>
            <button @click="$emit('clearCode')" class="px-3 py-1 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 transition">清空代码</button>
            <button @click="$emit('clearCanvas')" class="px-3 py-1 bg-red-50 text-red-600 rounded hover:bg-red-100 transition">清空画布</button>
          </div>
        `
      }

      // ===== CodePanel =====
      const CodePanel = {
        props: ['ggbApplet', 'interval', 'resetApplet', 'showCodePanel'],
        emits: ['update:running'],
        setup(props, { emit, expose }) {
          const code = ref('# 示例：画一个三角形\nA = (1, 1)\nB = (4, 2)\nC = (2, 5)\nPolygon(A, B, C)')
          const output = ref('')
          const running = ref(false)

          let pendingLines = []
          let errorResolve = null
          let manualStopped = false

          const confirmVisible = ref(false)
          const dialogType = ref('error')
          const confirmLine = ref('')
          const confirmMsg = ref('')

          function onCloseSuccess() { confirmVisible.value = false }
          function onConfirm(ok) {
            confirmVisible.value = false
            const resolver = errorResolve; errorResolve = null
            if (resolver) resolver(ok)
          }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }
          function askOnError(line, msg) {
            dialogType.value = 'error'
            confirmLine.value = line
            confirmMsg.value = msg
            confirmVisible.value = true
            return new Promise(resolve => { errorResolve = resolve })
          }

          async function run() {
            if (!props.ggbApplet) { output.value = '❌ GGB Applet 尚未加载完成'; return }
            if (running.value) return
            pendingLines = code.value.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).flatMap(l => l.split(';').map(s => s.trim())).filter(l => l)
            if (pendingLines.length === 0) { dialogType.value = 'success'; confirmMsg.value = '没有可执行的指令'; confirmVisible.value = true; return }
            running.value = true; emit('update:running', true); output.value = ''
            let hadError = false, userStopped = false
            manualStopped = false
            let successCount = 0, errorCount = 0
            while (pendingLines.length > 0) {
              if (manualStopped) break
              const line = pendingLines.shift()
              let ok = false, msg = ''
              const tryEval = async (cmd) => {
                console.debug('[DEBUG] tryEval 开始:', cmd)
                let evalResult = undefined
                let evalErr = null
                try {
                  evalResult = props.ggbApplet.evalCommand(cmd)
                  console.debug('[DEBUG] evalCommand 返回值:', evalResult, typeof evalResult)
                } catch (e) {
                  evalErr = e.message || String(e)
                  console.warn('[DEBUG] evalCommand 抛异常:', evalErr)
                  return { ok: false, msg: evalErr }
                }
                // 如果 evalCommand 返回 false，先 dump 所有可疑的错误 getter 方法
                if (evalResult === false) {
                  console.debug('[DEBUG] evalCommand=false, dump ggbApplet 上所有 error/exception/message 相关方法:')
                  const allKeys = Object.getOwnPropertyNames(props.ggbApplet).concat(Object.keys(props.ggbApplet))
                  const errorKeys = [...new Set(allKeys)].filter(k => /error|exception|message|warning|notice|last/i.test(k))
                  for (const k of errorKeys) {
                    try {
                      const fn = props.ggbApplet[k]
                      if (typeof fn === 'function') {
                        const r = fn.call(props.ggbApplet)
                        console.debug('[DEBUG]', k, '() →', JSON.stringify(r))
                      }
                    } catch (e) { console.debug('[DEBUG]', k, '抛异常:', e.message) }
                  }
                }
                // 多轮检测：立即查 + 等 GGB 异步刷新再查
                const tryGetErr = () => {
                  let err = null, src = null
                  const checks = ['getError','getErrorMessage','getException','getLastError','getErrorList','getErrorMessages','getWarning','getNotice','getInfoMessage']
                  for (const m of checks) {
                    try {
                      if (typeof props.ggbApplet[m] === 'function') {
                        const r = props.ggbApplet[m]()
                        console.debug('[DEBUG]', m, '→', JSON.stringify(r))
                        if (r !== null && r !== undefined && r !== '' && !(Array.isArray(r) && r.length === 0)) {
                          err = r; src = m; break
                        }
                      }
                    } catch (e) { console.debug('[DEBUG]', m, '抛异常:', e.message) }
                  }
                  return { err, src }
                }
                let { err, src } = tryGetErr()
                // 如果 evalCommand 返回 false 但没立刻查到，延迟 100ms 再查（GGB 可能异步刷新）
                if (!err && evalResult === false) {
                  console.debug('[DEBUG] 第一轮无错误，延迟 120ms 后再查...')
                  await new Promise(r => setTimeout(r, 120))
                  const again = tryGetErr()
                  err = again.err; src = again.src
                }
                console.debug('[DEBUG] tryEval 最终 →', err ? '失败 [' + src + ']' : '成功', err ? 'msg=' + String(err).trim() : '')
                if (err) return { ok: false, msg: (src ? '[' + src + '] ' : '') + String(err).trim() }
                // evalCommand 返回 false 且所有错误渠道都没内容 → 判成功但加警告提示
                if (evalResult === false) {
                  console.warn('[DEBUG] evalCommand=false 但无任何错误信息 → 判成功（GGB API 不可靠）')
                  return { ok: false, msg: '⚠ evalCommand 返回 false 但未检测到错误，可能成功也可能失败' }
                }
                return { ok: true, msg: '' }
              }
              const cmdMatch = line.match(/^\s*[A-Za-z]+/)
              const cmdAlias = cmdMatch ? cmdMatch[0].toLowerCase() : ''
              const isColorCmd = ['setcolor','setbgcolor','setlinecolor','setpointcolor','setobjcolor'].some(p => cmdAlias.startsWith(p))
              const isJsApiCmd = !isColorCmd && (cmdAlias in CMD_TO_JS_API)
              if (isColorCmd) {
                const argMatch = line.match(/^\s*[A-Za-z]+\s*\(([\s\S]*)\)\s*$/)
                const colorParsed = parseColorArgs(argMatch ? argMatch[1] : '')
                if (colorParsed.ok && colorParsed.rgb) {
                  try { props.ggbApplet.setColor(colorParsed.objName, colorParsed.rgb[0], colorParsed.rgb[1], colorParsed.rgb[2]); ok = true; output.value += 'ℹ️ setColor(' + colorParsed.objName + ', ' + colorParsed.rgb.join(', ') + ')\n' }
                  catch (e) { msg = 'setColor 执行失败: ' + (e.message || String(e)) }
                } else { msg = colorParsed.msg || 'SetColor 参数解析失败' }
              } else if (isJsApiCmd) {
                const jsApi = callJsApi(props.ggbApplet, line)
                if (jsApi.ok) { ok = true; output.value += 'ℹ️ ' + jsApi.msg + '\n' }
                else { msg = jsApi.msg }
              } else {
                const first = await tryEval(line)
                if (first.ok) ok = true
                else msg = first.msg
              }
              if (ok) {
                console.debug('[DEBUG] 指令 → 成功:', line); successCount++; output.value += '✅ ' + line + '\n'; await sleep(props.interval) }
              else {
                console.warn('[DEBUG] 指令 → 失败:', line, 'msg=', msg);
                console.debug('[DEBUG] → 即将调用 askOnError 弹出暂停对话框...');
                errorCount++; hadError = true; output.value += '❌ ' + line + '\n   ' + msg + '\n'; await sleep(props.interval); if (manualStopped) break; const cont = await askOnError(line, msg); console.debug('[DEBUG] askOnError 用户选择:', cont); if (!cont) { userStopped = true; pendingLines = []; break }; if (manualStopped) break }
            }
            running.value = false; emit('update:running', false)
            if (manualStopped) { dialogType.value = 'info'; confirmMsg.value = '已手动停止执行\n\n执行统计：成功 ' + successCount + ' 条，失败 ' + errorCount + ' 条，剩余 ' + pendingLines.length + ' 条未执行' }
            else if (userStopped) { dialogType.value = 'info'; confirmMsg.value = '因出错已停止执行\n\n执行统计：成功 ' + successCount + ' 条，失败 ' + errorCount + ' 条' }
            else if (hadError) { dialogType.value = 'warning'; confirmMsg.value = '指令执行完成，但有错误\n\n执行统计：成功 ' + successCount + ' 条，失败 ' + errorCount + ' 条' }
            else { dialogType.value = 'success'; confirmMsg.value = '全部指令执行成功！\n\n共执行 ' + successCount + ' 条' }
            confirmVisible.value = true; errorResolve = null
          }

          function clearCode() { code.value = ''; output.value = '' }
          function clearCanvas() { props.resetApplet(); output.value = '🗑 画布已清空\n' }
          function stop() {
            if (!running.value) return
            manualStopped = true; pendingLines = []
            if (errorResolve) { const r = errorResolve; errorResolve = null; r(false) }
            confirmVisible.value = false; running.value = false; emit('update:running', false)
          }
          function onKeydown(e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !running.value) { e.preventDefault(); run() } }

          expose({ run, stop, clearCode, clearCanvas })
          return { code, output, running, confirmVisible, dialogType, confirmLine, confirmMsg, onCloseSuccess, onConfirm, run, clearCode, clearCanvas, stop, onKeydown }
        },
        template: `
          <aside v-show="showCodePanel" class="basis-1/5 min-h-0 bg-white shadow flex flex-col p-3 gap-2">
            <h3 class="font-semibold text-slate-700">GGB 指令</h3>
            <textarea v-model="code" @keydown="onKeydown" spellcheck="false" class="flex-1 min-h-0 w-full resize-none font-mono text-sm bg-slate-50 border border-slate-200 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入 GeoGebra 指令，每行一条..."></textarea>
            <pre v-if="output" class="max-h-40 overflow-auto text-xs bg-slate-900 text-slate-100 rounded p-2 whitespace-pre-wrap">{{ output }}</pre>
          </aside>
          <Teleport to="body">
            <div v-if="confirmVisible" class="fixed inset-0 flex items-center justify-center bg-black/50" style="z-index: 9999" @click.self="dialogType === 'error' ? onConfirm(false) : onCloseSuccess()">
              <div class="bg-white rounded-lg shadow-2xl w-80 p-5 space-y-4">
                <template v-if="dialogType === 'error'">
                  <h4 class="font-semibold text-red-600 flex items-center gap-2"><span class="text-lg">⚠</span>指令执行出错</h4>
                  <div class="space-y-2">
                    <div class="text-sm text-slate-500">出错指令：</div>
                    <code class="block bg-slate-100 rounded px-2 py-1 font-mono text-sm break-all">{{ confirmLine }}</code>
                    <div class="text-sm text-slate-500 mt-2">错误信息：</div>
                    <div class="text-xs text-red-500 bg-red-50 rounded px-2 py-1 break-all">{{ confirmMsg }}</div>
                  </div>
                  <div class="flex justify-end gap-2 pt-2">
                    <button @click="onConfirm(false)" class="px-4 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 rounded transition">停止执行</button>
                    <button @click="onConfirm(true)" class="px-4 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded transition">继续下一条</button>
                  </div>
                </template>
                <template v-else>
                  <h4 class="font-semibold flex items-center gap-2" :class="dialogType === 'success' ? 'text-green-600' : dialogType === 'warning' ? 'text-amber-600' : 'text-sky-600'"><span class="text-lg">{{ dialogType === 'success' ? '✓' : dialogType === 'warning' ? '⚠' : 'ℹ' }}</span>执行完成</h4>
                  <p class="text-sm text-slate-600 whitespace-pre-line">{{ confirmMsg }}</p>
                  <div class="flex justify-end pt-2">
                    <button @click="onCloseSuccess" class="px-4 py-1.5 text-sm text-white rounded transition" :class="dialogType === 'success' ? 'bg-green-600 hover:bg-green-700' : dialogType === 'warning' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-sky-600 hover:bg-sky-700'">确定</button>
                  </div>
                </template>
              </div>
            </div>
          </Teleport>
        `
      }

      // ===== PromptModal =====
      const PromptModal = {
        props: ['visible'],
        emits: ['update:visible'],
        setup(props, { emit }) {
          const copied = ref(false)
          async function copyPrompt() {
            try { await navigator.clipboard.writeText(PROMPT_TEXT); copied.value = true; setTimeout(() => { copied.value = false }, 2000) }
            catch (err) { console.error('复制失败:', err) }
          }
          function close() { emit('update:visible', false) }
          return { copied, copyPrompt, close, PROMPT_TEXT }
        },
        template: `
          <Teleport to="body">
            <div v-if="visible" class="fixed inset-0 z-[9999] flex items-center justify-center">
              <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="close"></div>
              <div class="relative w-4/5 max-w-4xl max-h-[85vh] bg-white rounded-xl shadow-2xl flex flex-col">
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
                  <h2 class="text-lg font-semibold text-slate-800">Prompt</h2>
                  <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors" @click="close">✕</button>
                </div>
                <div class="flex-1 overflow-auto p-6"><pre class="whitespace-pre-wrap break-words text-sm text-slate-700 leading-relaxed font-sans">{{ PROMPT_TEXT }}</pre></div>
                <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-200 bg-slate-50 rounded-b-xl">
                  <button :class="['px-4 py-2 text-sm rounded-lg transition-all duration-200 active:scale-95 active:shadow-inner', copied ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white']" @click="copyPrompt">{{ copied ? '✓ 已复制' : '复制到剪贴板' }}</button>
                  <button class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm rounded-lg transition-colors" @click="close">关闭</button>
                </div>
              </div>
            </div>
          </Teleport>
        `
      }

      // ===== App =====
      const App = {
        components: { NavBar, ToolBar, CodePanel, PromptModal },
        setup() {
          const promptVisible = ref(false)
          const geogebra = useGeoGebra()
          const interval = ref(300)
          const running = ref(false)
          const codePanelRef = ref(null)
          const showCodePanel = ref(true)
          return { promptVisible, ...geogebra, interval, running, codePanelRef, showCodePanel }
        },
        template: `
          <div class="min-h-screen bg-slate-100 flex flex-col">
            <NavBar @open-prompt="promptVisible = true" />
            <main class="flex-1 flex py-0 gap-1">
              <CodePanel ref="codePanelRef" :ggb-applet="ggbApplet" :interval="interval" :reset-applet="resetApplet" :show-code-panel="showCodePanel" @update:running="running = $event" />
              <section class="flex-1 min-w-0 flex flex-col">
                <ToolBar :show="show" :show-code-panel="showCodePanel" :perspective-is3D="perspectiveIs3D" :interval="interval" :running="running" @toggle="toggleToolBar" @toggle-code-panel="showCodePanel = !showCodePanel" @update:interval="interval = $event" @run="codePanelRef && codePanelRef.run()" @stop="codePanelRef && codePanelRef.stop()" @clear-code="codePanelRef && codePanelRef.clearCode()" @clear-canvas="codePanelRef && codePanelRef.clearCanvas()" @switch-perspective="switchPerspective" />
                <div ref="ggbElement" id="ggb-element" class="flex-1 min-h-0 relative overflow-hidden shadow-lg shadow-blue-600/30 transition-colors bg-white"></div>
              </section>
            </main>
            <footer class="w-full bg-blue-700 text-white py-4"><p class="text-center">© 2026 yunend All rights reserved</p></footer>
            <PromptModal :visible="promptVisible" @update:visible="promptVisible = $event" />
          </div>
        `
      }

      createApp(App).mount('#app')
    </script>
  </body>
</html>
